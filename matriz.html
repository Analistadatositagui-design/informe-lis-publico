<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel operativo — Plataformas LIS</title>

<style>
  :root{--brand-700:#1f4e79;--brand-600:#245e97;--brand-500:#2e75b6;
        --ink:#0d1a26;--ink-2:#40566b;--muted:#6a7f92;--linea:#dbe6f0;--rojo:#e1251b;
        color-scheme:light only}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:#f7fafc;color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .caja{width:100%;max-width:420px;background:#fff;border:1px solid var(--linea);
        border-radius:10px;padding:32px 28px 28px;box-shadow:0 1px 3px rgba(13,26,38,.06)}
  .filete{height:4px;border-radius:4px 4px 0 0;margin:-32px -28px 24px;
          background:linear-gradient(90deg,#2ba9e0 0 25%,#e1251b 25% 50%,#f5b400 50% 75%,#5bb12f 75%)}
  img{display:block;height:56px;width:auto;margin:0 auto 18px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.25;
     margin:0 0 6px;text-align:center;letter-spacing:-.01em}
  .sub{font-size:13.5px;color:var(--ink-2);text-align:center;margin:0 0 22px;line-height:1.5}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
        font-weight:650;color:var(--muted);margin-bottom:7px}
  input{width:100%;padding:11px 13px;font-size:16px;font-family:inherit;
        border:1px solid var(--linea);border-radius:6px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--brand-500);outline-offset:-1px;border-color:var(--brand-500)}
  button{width:100%;margin-top:14px;padding:11px;font-size:15px;font-weight:600;
         font-family:inherit;color:#fff;background:var(--brand-600);border:0;
         border-radius:6px;cursor:pointer;transition:background .15s}
  button:hover:not(:disabled){background:var(--brand-700)}
  button:disabled{opacity:.6;cursor:progress}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:19px}
  .err{color:var(--rojo)}
  .info{color:var(--muted)}
  .pie{margin-top:22px;padding-top:16px;border-top:1px solid var(--linea);
       font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
  @media (prefers-reduced-motion:no-preference){
    .caja{animation:sube .3s cubic-bezier(.22,.61,.36,1) both}
    @keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<main class="caja">
  <div class="filete"></div>
  
  <h1>Panel operativo<br>Plataformas LIS</h1>
  <p class="sub">Documento interno<br>Introduce la clave de acceso para verlo.</p>
  <form id="f" autocomplete="off">
    <label for="c">Clave de acceso</label>
    <input id="c" type="password" inputmode="text" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="b" type="submit">Abrir documento</button>
  </form>
  <p class="msg" id="m" role="status" aria-live="polite"></p>
  <p class="pie">El contenido está cifrado con AES-256-GCM. Sin la clave correcta no hay nada legible,
     ni en esta página ni en su código fuente. El descifrado ocurre en tu dispositivo:
     la clave no viaja a ningún servidor.</p>
</main>

  var ITER  = 600000;

  function b64(s) { var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

  if (!(window.crypto && window.crypto.subtle)) {

    if (!frase) return;
    btn.disabled = true;

      crypto.subtle.importKey('raw', new TextEncoder().encode(frase), 'PBKDF2', false, ['deriveKey'])
